
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API CRUD Practice</title>
    <link rel="stylesheet" href="crud.css">
</head>
<body>

    <header class="main-header">
        <h1>Fetch API CRUD Practice</h1>
        <p>GET | POST | PUT | PATCH | DELETE</p>
    </header>

    <main class="container">

        <section class="form-section">
            <h2>Add Post</h2>

            <form id="postForm">
                <label for="postTitle">Post Title</label>
                <input
                    type="text"
                    id="postTitle"
                    placeholder="Enter post title"
                    required
                >

                <label for="userId">User ID</label>
                <input
                    type="number"
                    id="userId"
                    placeholder="Enter user ID"
                    min="1"
                    required
                >

                <label for="postBody">Post Content</label>
                <textarea
                    id="postBody"
                    placeholder="Enter post content"
                    rows="4"
                    required
                ></textarea>

                <button type="submit" id="addBtn">Add Post</button>
            </form>

            <button type="button" id="reloadBtn" class="reload-btn">
                Reload Posts
            </button>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="posts-section">
            <h2>Posts</h2>
            <div id="postsContainer" class="posts-grid"></div>
        </section>

    </main>
<script src="crud.js"></script>
</body>
</html>
