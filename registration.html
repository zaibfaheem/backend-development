<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student Registration <form action=""></form></title>
    <link rel="stylesheet" href="registration.css">
</head>
<body>
    
             <!-- Q4----------Student Registration Form -->
              <h1>Students Registration Form</h1>
              <form class="registration">
               <div class="form-row">
                     <!-- FULL NAME------------ -->
                <div class="field">
                <label for="full-name">Full Name</label> <br>
                <input type="text" 
                id="full-name" 
                name="student-name" 
                placeholder="Enter your full name"> <br>
                </div> 
                <!-- EMAIL--------------- -->
                 <div class="field">
                <label for="email">Email</label> <br>
                <input type="email" 
                id="email" 
                name="student-email"
                placeholder="enter email address"
                required> <br>
                </div>
                </div>
                <!-- PASSWORD------------ -->
                 <div class="form-row">
                    <div class="field">
                <label for="password">Password</label> <br>
                <input type="password" 
                id="password" 
                name="student-password"
                placeholder="enter your password"
                required > <br>
                </div> 
                <!-- DOB--------------- -->
                 <div class="field">
                <label for="dob">date of birth</label> <br>
                <input type="date" 
                id="dob" 
                name="student-dob"
                required> <br>
                </div>
                </div>
                <!--  GENDER---------- -->
                  <div class="field-group">
                <label for="male">Gender</label> <br>
                <input type="radio"
                id="male"
                name="gender"
                value="male">
                <label>Male</label> <br>
                <label for="female"></label>
                <input type="radio"
                id="female"
                name="gender"
                value="female">
                <label>Female</label>
                </div> <br>

                <!-- FVRT LANG------ -->
                 <div class="field-group">
                <label>Your Favorite languages</label> <br>
                <input type="checkbox"
                id="html"
                name="fvrt-lang"
                value="html">
                <label for="html">HTML</label> <br>
                <input type="checkbox"
                id="css"
                name="fvrt-lang"
                value="css">
                <label for="css">CSS</label> <br>
                <input type="checkbox"
                id="JavaScript"
                name="fvrt-lang"
                value="JavaScript">
                <label for="JavaScript">JavaScript</label> </div> <br>
                <!-- SELECT CITY------- -->
                 <div class="form-row">
                    <div class="field">
                <label for="city">choose your city</label>
                <select name="city" id="city">
                    <option value="islamabad">Islamabad</option>
                    <option value="karachi">Karachi</option>
                    <option value="lahore">Lahore</option> <br>
                    </select> <br>
                    </div>
                    <!-- TEXT AREA------------ -->
                     <div class="field">
                    <label for="intro">write about yourself</label><br>
                    <textarea name="introduction" id="intro"
                    placeholder="my name is zaib"></textarea>
                    </div>     
                </div>
                <div class="button-row">
                    <button type="submit">submit</button> <br>
                     <button type="reset" >reset</button>
                     </div>
                    </form>
</body>
</html>
